version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * 1"
      timezone: "Europe/Paris"
    labels:
      - "dependencies:ci"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * 1"
      timezone: "Europe/Paris"
    labels:
      - "dependencies:npm"
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@stylistic/*"
          - "@typescript-eslint/*"
      react:
        patterns:
          - "react*"
          - "@types/react*"
